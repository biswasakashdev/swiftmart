syntax = "proto3";

package accounts.roles.v1;

import "common/v1/common.proto";
import "types/accounts/v1/accounts.proto";

option go_package = "accountsv1";
option java_multiple_files = true;
option java_package = "com.biswasakashdev.swiftmart.protogen.accounts.v1";

// RoleService owns role and permission definitions for a store.
service RoleService {
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);

  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
  rpc EvaluatePermission(EvaluatePermissionRequest) returns (EvaluatePermissionResponse);
}

message CreateRoleRequest {
  string store_id = 1;
  string name = 2;
  string description = 3;
  repeated string permission_names = 4;
}

message CreateRoleResponse {
  types.accounts.v1.RoleProto role = 1;
}

message GetRoleRequest {
  string store_id = 1;
  string role_id = 2;
}

message GetRoleResponse {
  types.accounts.v1.RoleProto role = 1;
}

message ListRolesRequest {
  string store_id = 1;
  common.v1.PageRequest page = 2;
}

message ListRolesResponse {
  repeated types.accounts.v1.RoleProto roles = 1;
  common.v1.PageResponse page = 2;
}

message UpdateRoleRequest {
  string store_id = 1;
  string role_id = 2;
  optional string name = 3;
  optional string description = 4;
  repeated string permission_names = 5;
}

message UpdateRoleResponse {
  types.accounts.v1.RoleProto role = 1;
}

message DeleteRoleRequest {
  string store_id = 1;
  string role_id = 2;
}

message ListPermissionsRequest {
  string store_id = 1;
}

message ListPermissionsResponse {
  repeated types.accounts.v1.PermissionProto permissions = 1;
}

message EvaluatePermissionRequest {
  string store_id = 1;
  string user_id = 2;
  string permission_name = 3;
}

message EvaluatePermissionResponse {
  bool allowed = 1;
  string role_name = 2;
}

message DeleteRoleResponse {
  common.v1.Status status = 1;
}

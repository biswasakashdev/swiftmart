syntax = "proto3";

package accounts.users.v1;

import "common/v1/common.proto";
import "types/accounts/v1/accounts.proto";

option go_package = "accountsv1";
option java_multiple_files = true;
option java_package = "com.biswasakashdev.swiftmart.protogen.accounts.v1";

// UserService owns user identity and account state.
service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeactivateUser(DeactivateUserRequest) returns (DeactivateUserResponse);
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  types.accounts.v1.UsersProto user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string avatar = 4;
}

message UpdateUserResponse {
  types.accounts.v1.UsersProto user = 1;
}

message DeactivateUserRequest {
  string user_id = 1;
}

message DeactivateUserResponse {
  common.v1.Status status = 1;
}

syntax="proto3";

package accounts.v1;


service AuthService{

 rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);

}



message AuthorizeRequest{
  string email_or_phone =1 ;
  string password = 2;
  bool remember_me = 3;
}

message AuthorizeResponse{

  message User { 
    string name =1;
    string email= 2;
    string avatar = 3;
  }

  string token = 1;

  User user = 2;

}

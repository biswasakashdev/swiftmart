syntax="proto3";

package accounts.v1;

import "google/protobuf/empty.proto";

service UserService{

  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  
}

message GetUserRequest{
  string user_id = 1;
}

message GetUserResponse{
  string id = 1;
  string name = 2;
  string email = 3;
  string country_code = 4;
  string phone = 5;  
  optional string avatar = 6;
}




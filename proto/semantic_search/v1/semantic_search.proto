syntax = "proto3";

package semantic_search.v1.semantic_search;

import "types/v1/products.proto";
import "common/v1/common.proto";

option go_package = "semantic_search";
option java_package = "com.biswasakashdev.swiftmart.protogen.semantic_search.v1";
option java_multiple_files = true;

// SemanticSearchService provides natural-language product retrieval and
// recommendations. It is not the source of truth for catalogue state.
service SemanticSearchService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetRecommendations(GetRecommendationsRequest) returns (GetRecommendationsResponse);
  rpc RecordSearchEvent(RecordSearchEventRequest) returns (RecordSearchEventResponse);
}

message SearchRequest {
  common.v1.StoreContext context = 1;
  string query = 2;
  uint32 limit = 3;
  optional uint32 offset = 4;
  optional types.v1.products.ProductStatus status = 5;
}

message SearchResult {
  repeated types.v1.products.ProductProto products = 1;
  double score = 2;
  string query = 3;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message GetRecommendationsRequest {
  common.v1.StoreContext context = 1;
  string user_id = 2;
  uint32 limit = 3;
}

message GetRecommendationsResponse {
  repeated types.v1.products.ProductProto products = 1;
}

message RecordSearchEventRequest {
  common.v1.StoreContext context = 1;
  string user_id = 2;
  string query = 3;
  repeated string result_ids = 4;
}

message RecordSearchEventResponse {
  bool ok = 1;
}
syntax = "proto3";

package types.stores.v1;

import "common/v1/common.proto";

option go_package = "typesstoresv1";
option java_multiple_files = true;
option java_package = "com.biswasakashdev.swiftmart.protogen.types.stores.v1";

// Store represents an isolated business tenant.
message StoreProto {
  string id = 1;
  string owner_user_id = 2;
  string name = 3;
  string slug = 4;
  string description = 5;
  StoreStatus status = 6;
  string created_at = 7;
  string updated_at = 8;
  StoreSettings settings = 9;
}

enum StoreStatus {
  STORE_STATUS_UNSPECIFIED = 0;
  STORE_STATUS_ACTIVE = 1;
  STORE_STATUS_SUSPENDED = 2;
  STORE_STATUS_ARCHIVED = 3;
}

message StoreSettings {
  string currency = 1;
  string timezone = 2;
  string locale = 3;
  string contact_email = 4;
  string contact_phone = 5;
  common.v1.Address billing_address = 6;
}

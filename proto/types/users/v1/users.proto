syntax = "proto3";

package types.users.v1;

option go_package = "typesusersv1";
option java_multiple_files = true;
option java_package = "com.biswasakashdev.swiftmart.protogen.types.users.v1";

message UsersProto {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string created_at = 5;
  bool account_enabled = 6;
  optional string avatar = 7;
}

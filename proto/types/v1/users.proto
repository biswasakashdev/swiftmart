syntax = "proto3";

package types.v1.users;


option go_package = "typesv1";
option java_package = "com.biswasakashdev.swiftmart.protogen.prototypes.v1";
option java_multiple_files = true;

message UsersProto {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string created_at = 5;
  bool account_enabled = 6;
  optional string avatar = 7;
}
